<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; script-src 'self' https:; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:;" />
		<title>Nyaitter</title>
		<meta name="theme-color" content="#1d9bf0" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="favicon.png" type="image/png" />
		<link rel="apple-touch-icon" sizes="180x180" href="pwa-icon-192.png" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/emojione@4.0.0/extras/css/emojione.min.css"
			integrity="sha384-+JoywCPFwbtS2KrNLFu8EJHK+r5KPfqww25+fIBceLuhRk4muZy4TZR/4gXrk3qX"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="./style.css" />
		<style>
			#loading-overlay {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				background: var(--loading-color, rgba(255, 255, 255, 0.9));
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 99999;
			}
			#loading-overlay.hidden {
				display: none !important;
			}
			#loading-overlay .spinner {
				border: 4px solid var(--spin, rgba(0, 0, 0, 0.1));
				border-left-color: var(--primary-color, #ff9900);
				width: 44px;
				height: 44px;
				border-radius: 50%;
				animation: spin 1s ease infinite;
			}
			@keyframes spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}
		</style>
		<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" integrity="sha384-o28+zJO3/45GHIy+9TFKGaYnbt0KQcFRzyBrb0WSSrz7bPGwGI1d64worBiXPgXw" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/emoji-mart@5.6.0/dist/browser.js" integrity="sha384-lONtvEeik96slH87Kr9CY74xGakohuxbgkyhwbPDOM9ZzVfW7Twaltwp+WrerZ9k" crossorigin="anonymous"></script>
		<script src="./config.js"></script>
		<script src="./bootstrap.js"></script>
	</head>
	<body>
		<!-- 初期ロード表示 -->
		<div id="loading-overlay" role="status" aria-live="polite" aria-label="読み込み中" aria-hidden="false" aria-busy="true"><div class="spinner"></div></div>

		<!-- 接続失敗エラーオーバーレイ -->
		<div
			id="connection-error-overlay"
			class="modal-overlay hidden"
			style="z-index: 2000"
		>
			<div
				style="
					background: white;
					padding: 2rem;
					border-radius: 16px;
					text-align: center;
				"
			>
				<h2 style="margin-top: 0">Nyaitterへの接続に失敗しました</h2>
				<p>ネットワーク接続を確認して、もう一度お試しください。</p>
				<button
					id="retry-connection-btn"
					style="
						padding: 0.6rem 1.2rem;
						border-radius: 9999px;
						border: none;
						background-color: var(--primary-color);
						color: white;
						font-weight: 700;
					"
				>
					再試行
				</button>
			</div>
		</div>

		<!-- JavaScriptエラー / 致命的障害表示オーバーレイ -->
		<div
			id="mainjs-error-overlay"
			class="modal-overlay hidden"
			style="z-index: 3001"
		>
			<div
				style="
					background: white;
					padding: 2rem;
					border-radius: 16px;
					text-align: center;
					max-width: 400px;
					margin: 2rem auto;
				"
			>
				<h2 style="margin-top: 0; color: #d9534f">エラー</h2>
				<div
					id="mainjs-error-text"
					style="color: #d9534f; margin: 1em 0; word-break: break-all"
				></div>
				<p style="color: #888; font-size: 0.96em">
					Nyaitterに問題が発生しました
				</p>
				<ul
					style="
						text-align: left;
						color: #888;
						margin: 1.2em 0 1.5em 0;
						font-size: 0.98em;
					"
				>
					<li>キャッシュや拡張機能の影響の可能性があります</li>
					<li>
						キャッシュの削除や拡張機能の無効化をしても直らない場合は管理者へご連絡ください
					</li>
				</ul>
				<button
					id="mainjs-error-reload-btn"
					style="
						padding: 0.7em 1.5em;
						font-size: 1em;
						border-radius: 9999px;
						background: #1d9bf0;
						color: white;
						border: none;
						font-weight: 700;
					"
				>
					再読み込み
				</button>
			</div>
		</div>

		<!-- 動的マウント先 -->
		<div id="app-root"></div>

		<!-- スクリプト -->
	</body>
</html>
